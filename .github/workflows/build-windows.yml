name: Build Windows 10 package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.7.3 pyinstaller==6.11.1

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name MakroUploader
          --collect-all PySide6
          app.py

      - name: Add user documentation
        shell: pwsh
        run: Copy-Item README.md dist/MakroUploader/README.md

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/MakroUploader -DestinationPath dist/MakroUploader-Windows10.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MakroUploader-Windows10
          path: dist/MakroUploader-Windows10.zip
          if-no-files-found: error
